name: JC-SAVAGE Real HN-to-MUNCHER Bridge Preflight
on:
  push:
    branches: [jc-savage/pilot-api-anything-20261021]
    paths:
      - .github/workflows/jcs-hn-to-muncher-real-preflight.yml
permissions:
  contents: read
jobs:
  bridge-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIN: '20cb677039fcfe92d3d9c777aa9362e30ff1fdb8'
      JCS_PRODUCTION_DISPATCH: 'false'
      JCS_SUPABASE_WRITE_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Fetch pinned API Anything and enforce safe Tier-1 HN operation
        shell: bash
        run: |
          set -euo pipefail
          test "$JCS_PRODUCTION_DISPATCH" = false
          test "$JCS_SUPABASE_WRITE_ENABLED" = false
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JCS_SUPABASE_URL:-}"
          git clone --quiet --no-checkout https://github.com/goodnight000/api-anything.git "$RUNNER_TEMP/api-anything-src"
          cd "$RUNNER_TEMP/api-anything-src"
          git checkout --quiet "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          node - <<'NODE'
          const s=JSON.parse(require('fs').readFileSync('sites/hacker-news.json','utf8'));
          const o=s.operations.find(x=>x.name==='frontPage');
          if(!o||o.request.url!=='https://news.ycombinator.com/'||o.request.method!=='GET'||!o.readOnly||o.learnedLoggedIn||o.minTier!==1||o.slots.length)process.exit(1);
          NODE
          npm pkg set 'overrides.hono=4.13.11'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./package-lock.json').packages['node_modules/hono'].version")" = '4.13.11'
          ./node_modules/.bin/tsc -p tsconfig.build.json
      - name: Execute real source and produce intake envelope, NO Supabase writes
        env:
          API_ANYTHING_HOME: ${{ runner.temp }}/jcs-hn-bridge-ephemeral
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$API_ANYTHING_HOME"
          chmod 700 "$API_ANYTHING_HOME"
          cp pilot/hn-live-to-muncher-bridge.mjs "$RUNNER_TEMP/api-anything-src/hn-live-to-muncher-bridge.mjs"
          cd "$RUNNER_TEMP/api-anything-src"
          node hn-live-to-muncher-bridge.mjs
