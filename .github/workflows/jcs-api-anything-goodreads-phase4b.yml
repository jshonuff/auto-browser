name: JC-SAVAGE API Anything Phase 4B Goodreads GET-Only
on:
  push:
    branches:
      - jc-savage/pilot-api-anything-20261021
    paths:
      - .github/workflows/jcs-api-anything-goodreads-phase4b.yml
permissions:
  contents: read
jobs:
  site2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIN: '20cb677039fcfe92d3d9c777aa9362e30ff1fdb8'
      JCS_PRODUCTION_DISPATCH: 'false'
      JCS_SUPABASE_WRITE_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Fetch commit-pinned upstream and vet public Goodreads GET
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/goodnight000/api-anything.git "$RUNNER_TEMP/api-anything-src"
          cd "$RUNNER_TEMP/api-anything-src"
          git checkout --quiet "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          node - <<'NODE'
          const s=JSON.parse(require('node:fs').readFileSync('sites/goodreads.json','utf8'));
          const o=s.operations.find(v=>v.name==='searchBooks');
          if(!o||!o.readOnly||o.learnedLoggedIn||o.request.method!=='GET'||o.minTier!==1||o.slots.length!==1||o.slots[0].param!=='q'||!o.request.url.startsWith('https://www.goodreads.com/book/auto_complete?'))process.exit(1);
          NODE
          npm pkg set 'overrides.hono=4.13.11'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./package-lock.json').packages['node_modules/hono'].version")" = '4.13.11'
          ./node_modules/.bin/tsc -p tsconfig.build.json
      - name: Public Goodreads three-path comparison
        env:
          API_ANYTHING_HOME: ${{ runner.temp }}/jcs-goodreads-ephemeral
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$API_ANYTHING_HOME"
          chmod 700 "$API_ANYTHING_HOME"
          cp pilot/goodreads-phase4b.mjs "$RUNNER_TEMP/api-anything-src/goodreads-phase4b.mjs"
          cd "$RUNNER_TEMP/api-anything-src"
          node goodreads-phase4.mjs
