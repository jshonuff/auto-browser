name: JC-SAVAGE MUNCHER-X Controlled HN Intake
on:
  push:
    branches:
      - jc-savage/pilot-api-anything-20261021
    paths:
      - pilot/hn-oidc-live-submit.mjs
      - .github/workflows/jcs-hn-oidc-live-submit.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: jcs-hn-muncher-live-bridge
  cancel-in-progress: false
jobs:
  intake:
    name: Bounded public HN source into existing MUNCHER-X
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: jcs-muncher-intake-approved
    env:
      PIN: '20cb677039fcfe92d3d9c777aa9362e30ff1fdb8'
      JCS_PRODUCTION_DISPATCH: 'false'
      JCS_INTAKE_APPROVED: ${{ vars.JCS_INTAKE_APPROVED }}
      CI: 'true'
    steps:
      - name: Enforce environment-owned authorization before any source or database work
        shell: bash
        run: |
          set -euo pipefail
          test "$JCS_INTAKE_APPROVED" = 'true'
          test "$JCS_PRODUCTION_DISPATCH" = 'false'
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_URL:-}"
          echo 'JCS_ENVIRONMENT_GATE_APPROVED'
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Pin API Anything, validate fixed public HN GET and build
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/goodnight000/api-anything.git "$RUNNER_TEMP/api-anything-src"
          cd "$RUNNER_TEMP/api-anything-src"
          git checkout --quiet "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          node - <<'NODE'
          const s=JSON.parse(require('fs').readFileSync('sites/hacker-news.json','utf8'));
          const o=s.operations.find(x=>x.name==='frontPage');
          if(!o||o.request.url!=='https://news.ycombinator.com/'||o.request.method!=='GET'||!o.readOnly||o.learnedLoggedIn||o.minTier!==1||o.slots.length) process.exit(1);
          NODE
          npm pkg set 'overrides.hono=4.13.11'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./package-lock.json').packages['node_modules/hono'].version")" = '4.13.11'
          ./node_modules/.bin/tsc -p tsconfig.build.json
      - name: Real API Anything source and signed GitHub identity to bounded Supabase receiver
        shell: bash
        env:
          API_ANYTHING_HOME: ${{ runner.temp }}/jcs-live-intake
        run: |
          set -euo pipefail
          mkdir -p "$API_ANYTHING_HOME"
          chmod 700 "$API_ANYTHING_HOME"
          cp pilot/hn-oidc-live-submit.mjs "$RUNNER_TEMP/api-anything-src/hn-oidc-live-submit.mjs"
          cd "$RUNNER_TEMP/api-anything-src"
          node hn-oidc-live-submit.mjs
